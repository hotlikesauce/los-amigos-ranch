<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1" />
<title>Los Amigos Ranch</title>
<link rel="icon" href="https://jegisstoreage.blob.core.windows.net/je-seating-chart/favicon.png" />

<link rel="stylesheet" href="vendor/leaflet.css" />
<script src="vendor/leaflet.js"></script>
<script src="vendor/html2canvas.min.js"></script>
<!-- Google Analytics 4. Loads gtag.js and defines window.track(); skips both on
     localhost. Must come before map_chrome.js/app.js, which call track(). -->
<script src="analytics.js"></script>

<style>
  /* Chrome, palette and panel layout follow the Jonah Operations Map so this
     reads as part of the same family of internal maps. */
  :root {
    --panel-w: 340px;
    --navy: #0a2342;
    --blue: #1a6ab5;
    --bg: #f0f2f5;
    --card: #ffffff;
    --row-hover: #f4f7fb;
    --text: #1a2332;
    --muted: #637080;
    --border: #dde2ea;
    --accent: #1a6ab5;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    font: 14px/1.4 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    color: var(--text); background: var(--bg); overflow: hidden;
  }

  #app { display: flex; flex-direction: column; height: 100vh; }

  /* ---- Jonah blue banner ---- */
  .banner {
    background: linear-gradient(135deg, #0a2342 0%, #1a6ab5 100%);
    color: #fff; box-shadow: 0 4px 20px rgba(0,0,0,0.15);
    z-index: 600; flex-shrink: 0;
    padding: 0 40px;
  }
  .banner-row { display: flex; align-items: center; height: 72px; gap: 24px; position: relative; }
  .banner-logo { height: 88px; width: auto; flex-shrink: 0; }
  .banner-divider { width: 1px; height: 36px; background: rgba(255,255,255,0.2); flex-shrink: 0; }
  .banner-title { font-size: 1.15rem; font-weight: 700; }
  .banner-sub { font-size: 0.72rem; opacity: 0.6; margin-top: 2px; }
  /* Top-of-banner search: the primary way into the inventory, so it sits in
     the header rather than being buried in the panel. */
  .banner-search { margin-left: auto; position: relative; flex: 0 1 420px; min-width: 220px; }
  #search {
    width: 100%; padding: 10px 34px 10px 36px; font-size: 13.5px; color: var(--text);
    background: rgba(255,255,255,.96); border: 1px solid rgba(255,255,255,.5);
    border-radius: 8px; outline: none;
  }
  #search:focus { background: #fff; box-shadow: 0 0 0 3px rgba(255,255,255,.25); }
  .banner-search .s-icon {
    position: absolute; left: 11px; top: 50%; transform: translateY(-50%);
    color: var(--muted); pointer-events: none; display: flex;
  }
  .banner-search .s-clear {
    position: absolute; right: 8px; top: 50%; transform: translateY(-50%);
    border: none; background: none; color: var(--muted); cursor: pointer;
    font-size: 17px; line-height: 1; padding: 2px 4px; display: none;
  }
  .banner-search.has-q .s-clear { display: block; }
  .banner-search .s-clear:hover { color: var(--text); }
  /* Result dropdown hangs below the header search, over the map.
     The explicit color is required, not decorative: this list is a DOM
     descendant of .banner, which sets color:#fff for the header text, so the
     result labels would inherit white on a white card and be invisible. */
  #results {
    position: absolute; top: calc(100% + 6px); left: 0; right: 0; max-height: 60vh;
    overflow-y: auto; background: var(--card); border: 1px solid var(--border);
    border-radius: 10px; box-shadow: 0 12px 34px rgba(10,35,66,.30); display: none;
    z-index: 700; color: var(--text);
  }
  #results.open { display: block; }
  #search-meta {
    padding: 8px 12px; font-size: 11px; color: var(--muted);
    border-bottom: 1px solid var(--border); background: var(--bg);
    position: sticky; top: 0; text-transform: uppercase; letter-spacing: .4px; font-weight: 600;
  }
  .result { padding: 8px 12px; border-bottom: 1px solid var(--border); cursor: pointer; display: flex; gap: 9px; align-items: flex-start; }
  .result:last-child { border-bottom: none; }
  .result:hover, .result.active { background: var(--row-hover); }
  .result .r-body { flex: 1; min-width: 0; }
  .result .lbl { font-weight: 600; font-size: 13px; }
  .result .cat { font-size: 11px; color: var(--muted); margin-top: 1px; }
  .result mark { background: rgba(26,106,181,.20); color: inherit; border-radius: 2px; }
  .result .r-cam { flex: none; color: var(--muted); display: flex; align-items: center; gap: 3px; font-size: 10.5px; }
  .empty { padding: 16px 14px; color: var(--muted); font-size: 12.5px; }

  #main { flex: 1; display: flex; min-height: 0; position: relative; }
  #panel {
    width: var(--panel-w); flex-shrink: 0; background: var(--card);
    border-right: 1px solid var(--border); display: flex; flex-direction: column; z-index: 500;
  }
  /* Only ever shown behind the mobile drawer (see the 860px block); kept out of
     the flex row entirely at desktop width. */
  #panel-backdrop { display: none; }
  #map { flex: 1; min-width: 0; height: 100%; }

  /* ---- Water-system filter: the map's central question is "which system is
     this line on", so it gets a permanent control at the top of the panel. ---- */
  .sysfilter { padding: 12px 14px; border-bottom: 1px solid var(--border); }
  .sysfilter-hd {
    font-size: 11px; text-transform: uppercase; letter-spacing: .5px;
    color: var(--muted); font-weight: 700; margin-bottom: 8px;
  }
  .sysfilter-pills { display: flex; flex-wrap: wrap; gap: 6px; }
  .sysfilter-pill {
    display: inline-flex; align-items: center; gap: 6px;
    padding: 5px 11px; border-radius: 14px; border: 1.5px solid var(--border);
    background: #fff; font-size: 12px; cursor: pointer; color: var(--muted);
  }
  .sysfilter-pill:hover { border-color: var(--accent); color: var(--text); }
  .sysfilter-pill.active { background: var(--accent); border-color: var(--accent); color: #fff; }
  .sysfilter-pill .dot { width: 9px; height: 9px; border-radius: 50%; flex: none; }
  .sysfilter-pill.active .dot { box-shadow: 0 0 0 1.5px rgba(255,255,255,.85); }

  #layers { flex: 1; overflow-y: auto; }
  .cat-group > .cat-head {
    display: flex; align-items: center; gap: 8px;
    padding: 8px 14px; font-size: 11px; text-transform: uppercase; letter-spacing: .5px;
    color: var(--muted); background: var(--bg); border-bottom: 1px solid var(--border);
    position: sticky; top: 0; z-index: 2;
  }
  .cat-head-label { display: flex; align-items: center; gap: 8px; flex: 1; min-width: 0; cursor: pointer; }
  .cat-head input { accent-color: var(--accent); margin: 0; cursor: pointer; }
  .cat-head .cat-name { flex: 1; }
  .cat-head .cat-count { font-weight: 600; opacity: .7; font-variant-numeric: tabular-nums; }
  /* collapse chevron: rotates to point right when the group's rows are hidden */
  .cat-collapse-btn {
    flex: none; display: flex; align-items: center; justify-content: center;
    width: 20px; height: 20px; padding: 0; border: none; background: transparent;
    color: var(--muted); cursor: pointer; border-radius: 4px;
  }
  .cat-collapse-btn:hover { background: rgba(0,0,0,.06); color: var(--text); }
  .cat-collapse-btn svg { transition: transform .15s ease; }
  .cat-group.collapsed .cat-collapse-btn svg { transform: rotate(-90deg); }
  .cat-group.collapsed .cat-body { display: none; }
  .layer-row { display: flex; align-items: center; gap: 8px; padding: 6px 14px; cursor: pointer; }
  .layer-row:hover { background: var(--row-hover); }
  .layer-row input { accent-color: var(--accent); flex: none; }
  .layer-row .nm { font-size: 12.5px; flex: 1; min-width: 0; }
  .layer-row .ct { font-size: 11px; color: var(--muted); font-variant-numeric: tabular-nums; flex: none; }
  .layer-row.is-empty { opacity: .45; }
  /* swatch shape matches the layer's actual on-map symbol: point = dot,
     line = bar, square/star/camera = that exact glyph. */
  .swatch { flex: none; border: 1px solid rgba(0,0,0,.15); }
  .swatch-point { width: 11px; height: 11px; border-radius: 50%; }
  .swatch-line { width: 16px; height: 4px; border-radius: 2px; border-color: rgba(0,0,0,.25); }
  .swatch-polygon { width: 12px; height: 12px; border-radius: 2px; }
  .swatch-square { width: 11px; height: 11px; border-radius: 2px; }
  .swatch-diamond { width: 10px; height: 10px; border-radius: 1px; transform: rotate(45deg); }
  .swatch-star {
    width: 13px; height: 13px; border: none;
    clip-path: polygon(50% 0%, 61% 35%, 98% 35%, 68% 57%, 79% 91%, 50% 70%, 21% 91%, 32% 57%, 2% 35%, 39% 35%);
  }
  .swatch-triangle {
    width: 12px; height: 12px; border: none;
    clip-path: polygon(50% 4%, 96% 92%, 4% 92%);
  }
  .swatch-camera { width: 13px; height: 11px; border-radius: 2px; position: relative; }
  .swatch-camera::before {
    content: ""; position: absolute; left: 50%; top: 50%; transform: translate(-50%,-50%);
    width: 5px; height: 5px; border-radius: 50%; border: 1.5px solid rgba(255,255,255,.9);
  }
  .swatch-dashed { width: 16px; height: 0; border-top: 3px dashed currentColor; border-left: none; border-right: none; border-bottom: none; background: none !important; }

  .basemap { display: flex; gap: 6px; padding: 10px 14px; border-top: 1px solid var(--border); }
  .basemap button {
    flex: 1; padding: 7px 0; font-size: 12.5px; cursor: pointer;
    background: #fff; color: var(--muted); border: 1px solid var(--border); border-radius: 7px;
  }
  .basemap button.active {
    background: linear-gradient(135deg, #0a2342 0%, #1a6ab5 100%);
    color: #fff; border-color: var(--navy);
  }
  .basemap-opacity-wrap { padding: 4px 14px 10px; }
  .basemap-opacity-slider { width: 100%; accent-color: var(--accent); cursor: pointer; }
  .panel-foot {
    padding: 8px 14px 12px; border-top: 1px solid var(--border);
    font-size: 10.5px; color: var(--muted); line-height: 1.5;
  }

  /* ---- Permanent map labels, colored to match each layer ----
     Sized off --label-scale, which app.js updates on every zoom: a fixed pixel
     size looks right at the opening extent but shrinks into illegibility
     relative to the imagery as you zoom in on an asset. */
  .map-label {
    background: transparent !important; border: none !important; box-shadow: none !important;
    padding: 0 !important; font-weight: 600; white-space: nowrap;
    font-size: calc(11.5px * var(--label-scale, 1));
    text-shadow: 0 0 2px #fff, 0 0 2px #fff, 0 0 3px #fff, 0 0 4px #fff;
  }
  .map-label:before { display: none; }
  /* Leaflet owns the tooltip element's own transform (it positions it), so the
     zoom lift is applied to this inner span instead -- it keeps the label clear
     of its marker as the marker glyph grows. */
  .lbl-inner {
    display: inline-block;
    transform: translateY(calc(-1 * var(--label-lift, 0px)));
  }
  .lbl-water { color: #0b4f8a; }
  .lbl-site  { color: #141414; font-weight: 700; font-size: calc(12.5px * var(--label-scale, 1)); }
  .lbl-lake  { color: #1f6fd0; font-style: italic; }
  .lbl-hunt  { color: #5b4a2e; }
  /* Labels are dense at ranch scale, so they only appear once zoomed in far
     enough to read them (see updateLabelZoom in app.js). */
  .map-label { display: none; }
  .show-infra-labels .map-label.lbl-water,
  .show-infra-labels .map-label.lbl-hunt { display: block; }
  .show-site-labels .map-label.lbl-site,
  .show-site-labels .map-label.lbl-lake { display: block; }

  /* custom shape markers (squares, stars, camera pins) -- drop Leaflet's box.
     Glyphs grow with zoom by being rebuilt at a new size in app.js, not by a
     CSS transform, so the clickable area grows along with the drawing. */
  .shape-marker { background: transparent; border: none; }
  /* Upscaled aerial should stay smooth rather than turn into hard pixels --
     the supplied 2018 ranch overlay is only 7.5 m/px, so it is always being
     enlarged past its native resolution. */
  .leaflet-pane img.leaflet-image-layer { image-rendering: auto; }

  /* Water mains: a dark casing under the bright line, applied once to the whole
     pane instead of drawing every pipeline twice. This is what lets the line
     colors be as saturated as they are -- the halo separates them from a pale
     topo sheet and from the noise of the aerial equally well. Two shadows so
     the edge holds up over light and dark ground alike. */
  .water-line-pane {
    filter: drop-shadow(0 0 1.4px rgba(3, 22, 42, .85))
            drop-shadow(0 1px 2.5px rgba(3, 22, 42, .45));
  }
  /* A stacked pair of drop-shadows repaints the whole pane on every pan frame,
     which is a real cost on a phone GPU. Touch devices get a single, slightly
     stronger shadow -- visually near-identical, roughly half the fill work. */
  @media (pointer: coarse) {
    .water-line-pane { filter: drop-shadow(0 0 1.6px rgba(3, 22, 42, .9)); }
  }
  /* the marker that search/photo navigation is currently focused on */
  .focus-glow { filter: drop-shadow(0 0 5px #ffce00) drop-shadow(0 0 9px #ffce00); }

  /* ---- Popup: bordered card with a Jonah-blue header bar ---- */
  .leaflet-popup-content-wrapper {
    border: 1px solid #cbd5e1; border-radius: 10px; padding: 0; overflow: hidden;
    box-shadow: 0 8px 26px rgba(10,35,66,.28);
  }
  .leaflet-popup-content { margin: 0; width: auto !important; min-width: 300px; }
  .popup-hd {
    background: linear-gradient(135deg, #0a2342 0%, #1a6ab5 100%); color: #fff;
    font-weight: 700; font-size: 12.5px; padding: 9px 32px 9px 12px; line-height: 1.3;
  }
  .popup-hd-sub { font-weight: 500; font-size: 10px; opacity: 0.82; display: block; margin-top: 1px; }
  .popup-bd { padding: 8px 12px 10px; font: 11.5px/1.45 -apple-system,"Segoe UI",Roboto,sans-serif; }
  .popup-row { display: flex; gap: 8px; margin: 3px 0; }
  .popup-row .k { color: #637080; min-width: 84px; font-size: 10px; white-space: nowrap; padding-top: 1px; }
  .popup-row .v { color: #1a2332; }
  .popup-sec {
    margin: 9px 0 6px; padding-top: 6px; border-top: 1px solid #e6eaf0;
    font-size: 9px; text-transform: uppercase; letter-spacing: .5px; color: #8a94a3; font-weight: 700;
  }
  .leaflet-popup-close-button {
    color: var(--muted) !important; top: 6px !important; right: 8px !important; font-size: 18px !important;
  }
  .leaflet-popup-close-button:hover { color: var(--text) !important; }

  /* ---- Stacked-point carousel header ---- */
  .stack-nav {
    display: flex; align-items: center; justify-content: space-between; gap: 8px;
    /* extra right padding clears Leaflet's popup close "x", which otherwise
       sits directly on top of the next button */
    padding: 7px 34px 7px 8px; background: #eef3f9; border-bottom: 1px solid var(--border);
  }
  .stack-nav button {
    border: 1px solid var(--border); background: #fff; color: var(--navy);
    width: 26px; height: 24px; border-radius: 5px; cursor: pointer;
    font-size: 15px; line-height: 1; font-weight: 700; flex: none;
  }
  .stack-nav button:hover { background: var(--row-hover); border-color: var(--accent); }
  .stack-count {
    font-size: 11px; color: var(--muted); letter-spacing: .3px; font-weight: 600;
    text-transform: uppercase;
  }

  /* ---- Photos in a popup: thumbnail strip, click to open the lightbox ---- */
  .popup-photos { display: flex; gap: 6px; flex-wrap: wrap; }
  .popup-photo {
    width: 84px; height: 64px; border-radius: 6px; overflow: hidden; cursor: pointer;
    border: 1px solid var(--border); background: #eef1f5; position: relative; padding: 0;
  }
  .popup-photo img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .popup-photo:hover { border-color: var(--accent); }
  .popup-photo:hover img { opacity: .88; }

  /* ---- Lightbox ---- */
  #lightbox {
    position: fixed; inset: 0; z-index: 3000; background: rgba(8,20,34,.92);
    display: none; align-items: center; justify-content: center; flex-direction: column;
  }
  #lightbox.open { display: flex; }
  .lb-stage {
    flex: 1; min-height: 0; width: 100%; display: flex; align-items: center;
    justify-content: center; padding: 46px 70px 10px; position: relative;
  }
  .lb-stage img {
    max-width: 100%; max-height: 100%; object-fit: contain;
    border-radius: 6px; box-shadow: 0 14px 50px rgba(0,0,0,.55);
  }
  .lb-bar {
    flex: none; width: 100%; padding: 10px 24px 20px; color: #fff; text-align: center;
  }
  .lb-title { font-size: 14px; font-weight: 700; }
  .lb-meta { font-size: 11.5px; color: rgba(255,255,255,.62); margin-top: 3px; }
  .lb-meta a { color: #8fc4f2; }
  .lb-close, .lb-nav {
    position: absolute; border: 1px solid rgba(255,255,255,.28); color: #fff;
    background: rgba(255,255,255,.10); border-radius: 8px; cursor: pointer;
    display: flex; align-items: center; justify-content: center;
  }
  .lb-close { top: 14px; right: 18px; width: 34px; height: 34px; font-size: 20px; line-height: 1; }
  .lb-nav { top: 50%; transform: translateY(-50%); width: 40px; height: 56px; font-size: 24px; }
  .lb-prev { left: 16px; }
  .lb-next { right: 16px; }
  .lb-close:hover, .lb-nav:hover { background: rgba(255,255,255,.22); }
  .lb-nav[disabled] { opacity: .25; cursor: default; }
  .lb-count {
    position: absolute; top: 18px; left: 20px; color: rgba(255,255,255,.7);
    font-size: 12px; font-variant-numeric: tabular-nums;
  }

  /* ---- Trace / isolation results pane (right edge) ---- */
  #trace-pane {
    position: absolute; top: 0; right: 0; bottom: 0; width: 320px; max-width: 92vw;
    background: var(--card); border-left: 1px solid var(--border); z-index: 520;
    display: flex; flex-direction: column;
    transform: translateX(101%); transition: transform .22s ease;
    box-shadow: -8px 0 28px rgba(10,35,66,.22);
  }
  #trace-pane.open { transform: translateX(0); }
  .trace-hd {
    background: linear-gradient(135deg, #0a2342 0%, #1a6ab5 100%); color: #fff;
    padding: 11px 14px; display: flex; align-items: center; gap: 10px; flex-shrink: 0;
  }
  .trace-hd .t { flex: 1; min-width: 0; font-weight: 700; font-size: 13px; }
  .trace-hd .t small { display: block; font-weight: 500; font-size: 10.5px; opacity: .8; margin-top: 1px; }
  .trace-close {
    border: none; background: none; color: #fff; font-size: 21px; line-height: 1;
    cursor: pointer; opacity: .85; padding: 0 3px;
  }
  .trace-close:hover { opacity: 1; }
  #trace-body { flex: 1; overflow-y: auto; }
  .trace-stats { display: flex; border-bottom: 1px solid var(--border); background: var(--bg); }
  .trace-stat { flex: 1; padding: 10px 8px; text-align: center; border-right: 1px solid var(--border); }
  .trace-stat:last-child { border-right: none; }
  .trace-stat .v { font-size: 1.15rem; font-weight: 700; color: var(--navy); line-height: 1.1; }
  .trace-stat .l { font-size: .58rem; color: var(--muted); text-transform: uppercase; letter-spacing: .4px; margin-top: 3px; }
  .trace-note {
    padding: 9px 14px; font-size: 11.5px; color: #46505e; background: #f4f7fb;
    border-bottom: 1px solid var(--border); line-height: 1.45;
  }
  .trace-note.warn { background: #fff6e5; color: #6b4c12; }
  .trace-sec {
    padding: 8px 14px 6px; font-size: 10px; text-transform: uppercase; letter-spacing: .5px;
    color: var(--muted); font-weight: 700; background: var(--bg);
    border-top: 1px solid var(--border); border-bottom: 1px solid var(--border);
  }
  .trace-row {
    display: flex; align-items: center; gap: 9px; padding: 9px 14px; cursor: pointer;
    border-bottom: 1px solid var(--border); font-size: 12.5px;
  }
  .trace-row:hover { background: var(--row-hover); }
  .trace-row .sw { width: 11px; height: 11px; border-radius: 50%; flex: none; border: 1px solid rgba(0,0,0,.2); }
  .trace-row .nm { flex: 1; min-width: 0; }
  .trace-row .nm small { display: block; color: var(--muted); font-size: 10.5px; margin-top: 1px; }
  .trace-row .cam { flex: none; color: var(--muted); display: flex; align-items: center; gap: 2px; font-size: 10.5px; }
  .trace-empty { padding: 16px 14px; color: var(--muted); font-size: 12.5px; line-height: 1.5; }
  /* isolation valves get a numbered marker so the list maps onto the map */
  .trace-row .num {
    flex: none; width: 19px; height: 19px; border-radius: 50%; background: #e03131; color: #fff;
    font-size: 10.5px; font-weight: 700; display: flex; align-items: center; justify-content: center;
  }
  .iso-badge {
    background: #e03131; color: #fff; border: 2.5px solid #fff; border-radius: 50%;
    font: 800 12px/1 -apple-system, "Segoe UI", Roboto, sans-serif;
    display: flex; align-items: center; justify-content: center;
    box-shadow: 0 0 0 0 rgba(224,49,49,.6), 0 2px 7px rgba(0,0,0,.5);
    animation: isoPulse 1.8s ease-out infinite;
  }
  @keyframes isoPulse {
    0%   { box-shadow: 0 0 0 0 rgba(224,49,49,.60), 0 2px 7px rgba(0,0,0,.5); }
    70%  { box-shadow: 0 0 0 13px rgba(224,49,49,0), 0 2px 7px rgba(0,0,0,.5); }
    100% { box-shadow: 0 0 0 0 rgba(224,49,49,0),   0 2px 7px rgba(0,0,0,.5); }
  }
  /* The isolated run: marching ants along the pipe, so the extent of what goes
     dry reads instantly and is impossible to confuse with the static linework. */
  .iso-run { stroke-dasharray: 15 9; animation: isoDash .85s linear infinite; }
  @keyframes isoDash { to { stroke-dashoffset: -24; } }
  @media (prefers-reduced-motion: reduce) {
    .iso-badge { animation: none; }
    .iso-run { animation: none; }
  }
  /* Header turns red in isolate mode so the pane matches the map. */
  #trace-pane.iso .trace-hd { background: linear-gradient(135deg, #7a1414 0%, #e03131 100%); }

  /* Popup action buttons. Isolate is the loud one: it answers the urgent
     question ("how do I shut this off?"), and its red ties to the red used for
     the isolated run and its numbered valves on the map. Trace is the calm,
     exploratory sibling and steps back to an outline so the two don't compete. */
  .popup-actions { display: flex; gap: 7px; margin-top: 10px; }
  .popup-actions button {
    flex: 1; padding: 9px 8px; font-size: 12px; font-weight: 700; cursor: pointer;
    border: 1.5px solid var(--border); background: #fff; color: var(--navy); border-radius: 7px;

  .gal-empty { color: rgba(255,255,255,.6); padding: 30px; grid-column: 1 / -1; text-align: center; }
  /* "Show on map" in the lightbox bar */
  .lb-actions { margin-top: 9px; display: flex; gap: 8px; justify-content: center; }

  /* banner action buttons (gallery) */
  .banner-btn {

  /* ---- live cursor lat/lng + scale readouts ---- */

  .coordpin { padding: 14px 16px 16px; }

  /* ---- Branded splash while the layers load ---- */
  #splash {
    position: fixed; inset: 0; z-index: 9999;
    background: radial-gradient(1100px 760px at 50% 32%, #1a6ab5 0%, #0e2f54 55%, #081d34 100%);
    display: flex; align-items: center; justify-content: center;
    opacity: 1; transition: opacity .55s ease;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
  }
  #splash.hide { opacity: 0; pointer-events: none; }
  #splash::before {
    content: ""; position: absolute; inset: 0; pointer-events: none; opacity: .10;
    background-image: linear-gradient(rgba(255,255,255,.6) 1px, transparent 1px),
                      linear-gradient(90deg, rgba(255,255,255,.6) 1px, transparent 1px);
    background-size: 46px 46px;
    -webkit-mask-image: radial-gradient(circle at 50% 40%, #000 0%, transparent 70%);
            mask-image: radial-gradient(circle at 50% 40%, #000 0%, transparent 70%);
    animation: splashDrift 22s linear infinite;
  }
  .splash-inner {
    position: relative; display: flex; flex-direction: column; align-items: center;
    gap: 1.35rem; text-align: center; padding: 24px;

  }
  .splash-logo {

    filter: drop-shadow(0 8px 30px rgba(0,0,0,.4));

  .splash-bar span {
    display: block; height: 100%; width: 38%; border-radius: 99px;
    background: linear-gradient(90deg, rgba(255,255,255,0), #fff 50%, rgba(255,255,255,0));
    animation: splashSlide 1.35s ease-in-out infinite;
  }
  @keyframes splashPulse { 0%,100% { transform: scale(1); opacity: .92; } 50% { transform: scale(1.045); opacity: 1; } }
  @keyframes splashSlide { 0% { transform: translateX(-130%); } 100% { transform: translateX(360%); } }
  @keyframes splashRise  { from { opacity: 0; transform: translateY(14px); } to { opacity: 1; transform: none; } }
  @keyframes splashDrift { from { background-position: 0 0; } to { background-position: 46px 46px; } }
  @media (prefers-reduced-motion: reduce) {

  /* ---- Mobile: the panel becomes a slide-over drawer ---- */
  .panel-toggle {

  @media (max-width: 860px) {

    .panel-toggle { display: flex; margin-left: auto; }
    #panel {

    #panel.open { transform: translateX(0); }

    #panel-backdrop {

    .lb-nav { width: 38px; height: 52px; font-size: 22px; }
    .lb-close { width: 38px; height: 38px; }

    /* Touch targets: 34px mouse-sized controls are below the ~44px comfortable

    .layer-row { padding: 10px 14px; }
    .layer-row input[type=checkbox] { width: 18px; height: 18px; }
    .cat-group > .cat-head { padding: 11px 14px; }

    .result { padding: 11px 12px; }

    .measure-btn, .coordpin-btn, .export-btn { width: 40px; height: 40px; }

    /* Results list can't run past the viewport on a short screen. */
    #results { max-height: 55vh; }
    /* Popups: the desktop 300px minimum overflows a narrow phone. */
    .leaflet-popup-content { min-width: 0 !important; }
    .popup-photo { width: 92px; height: 70px; }
    /* Bottom-left readouts stack instead of colliding with the attribution. */
    .coord-box, .scale-box { font-size: 10px; padding: 2px 6px; }
  }

  /* Very small screens: the panel takes the full width, since 86% of a 360px

  @media (max-width: 430px) {
    #panel { width: 100%; max-width: none; }
    .banner-logo { height: 38px; }
    .popup-photo { width: 78px; height: 60px; }

  /* Landscape phones are short, not narrow -- reclaim vertical space. */
  @media (max-height: 480px) and (max-width: 900px) {

  @media (pointer: coarse) {
    .layer-row { padding: 10px 14px; }
    .measure-btn, .coordpin-btn, .export-btn { width: 40px; height: 40px; }
    .popup-photo { width: 92px; height: 70px; }

  }
</style>
