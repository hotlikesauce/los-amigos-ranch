name: Deploy to GitHub Pages

# The site is the pre-built contents of public/ -- no build step. Uploading that
# folder as the Pages artifact (rather than serving the repo root or /docs) keeps
# the project layout intact and stops the raw scripts/ and config from being
# published alongside the map.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: public
      - id: deploy
        uses: actions/deploy-pages@v4
